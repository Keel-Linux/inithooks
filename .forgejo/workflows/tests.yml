# Forgejo copy of .github/workflows/tests.yml (decision 0056): the same
# jobs, with a runs-on line on each call of a reusable workflow,
# because Forgejo runs a called workflow on the runner of the caller.
# Coverage gates for inithooks, one per language (docs/ci-cd.md):
#   tests / coverage   shell: tests/coverage.sh under kcov, 98 percent, the
#                      number measured on master (lowest file lib/init-fence.sh
#                      63 of 64 lines, COVERAGE.md "measured baseline")
#   python / coverage  pytest under coverage.py over libinithooks and bin,
#                      95 percent, the bar for project-authored code; the
#                      inherited modules without tests are omitted in
#                      pyproject.toml until their tests land
# Both are required checks on master. Thresholds are only ever raised.
# Every job runs on keel-container, a new rootless container for each
# job: no job of inithooks needs the LXC of the runner host, and a job of
# a pull request from a fork must not run on the host. The runner refuses
# a fork job on keel-host whatever this file says (handbook
# docs/infra/keel-lxc-2.md, "Fork pull requests run in a container").
name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    runs-on: keel-container
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 98
      # tests/test-packaging.bats runs debhelper over debian/ and reads the
      # maintainer scripts it generates, and tests/test-firstboot-pty.bats
      # runs the first boot screens with the real dialog; in CI a missing
      # package fails them
      apt-packages: debhelper dialog python3-dialog
  python:
    runs-on: keel-container
    uses: keel-linux/.github/.github/workflows/test-python.yml@main
    with:
      threshold: 95
      package: libinithooks,bin
      tests: tests
  keel:
    # Forgejo copy of the "keel" job of .github/workflows/tests.yml: fetch
    # keel beside inithooks and run the suite with KEEL_SRC set, so the
    # differential, property and end-to-end tests actually run. The
    # checkout goes to .keel-src, not keel: with PYTHONPATH=. a directory
    # named keel at the workspace root would be imported as the keel
    # package itself (a namespace package) instead of keel/keel inside
    # it. ref is pinned to a SHA so a keel change cannot pass or fail
    # this suite without any change here.
    runs-on: keel-container
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Keel-Linux/keel
          ref: 5f44f0e67b116f8f8c93585e1933b6715fbea4ee
          path: .keel-src
      - name: Python in a virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install test tools
        run: python -m pip install --quiet pytest pyyaml
      - name: Run the suite against keel
        run: KEEL_SRC="$GITHUB_WORKSPACE/.keel-src" PYTHONPATH=. python -m pytest -q tests
  # A change that ships must come with a changelog entry, or it cannot be
  # installed and never reaches an appliance. The rule and its tests are
  # bin/require-changelog of the .github repository. The check is
  # "package / changelog"; it runs on pull requests only.
  package:
    if: github.event_name == 'pull_request'
    runs-on: keel-container
    uses: keel-linux/.github/.github/workflows/require-changelog.yml@main
