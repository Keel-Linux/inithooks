# inithooks: the init fence survives nftables.service (inithooks#68).
#
# Debian's /etc/nftables.conf starts with `flush ruleset`, and the unit's
# stop runs `nft flush ruleset`: each start, reload, restart and stop of
# nftables.service removes the fence's table `inet keel_fence`, and the
# application answers on the fenced ports before keel-init. A reinstall
# or an upgrade of nftables restarts the unit, also in the first boot's
# security update. So the fence loads its table again right after each of
# them, while turnkey-init-fence.service is active. At boot the fence
# starts after nftables.service, and this does nothing. The `-`: a
# failure here never fails nftables.service; the fence says it in the
# journal and on the console.
#
# keel's drop-in in this directory (keel-firewall.conf) loads keel's
# table `inet keel` again in the same way; the two tables are separate.
[Service]
ExecStartPost=-/usr/lib/inithooks/bin/turnkey-init-fence reload-rules
ExecReload=-/usr/lib/inithooks/bin/turnkey-init-fence reload-rules
ExecStopPost=-/usr/lib/inithooks/bin/turnkey-init-fence reload-rules
