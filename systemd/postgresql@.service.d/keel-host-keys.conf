# Installed by inithooks. Every PostgreSQL cluster starts after
# keel-host-keys.service, which makes the snakeoil pair the cluster reads
# (ssl_cert_file, ssl_key_file). A layer ships no private key, so on the
# first boot the pair is not there before that unit has run.
#
# Before=postgresql.service in keel-host-keys.service does not do this:
# postgresql.service is the meta unit, and each postgresql@VERSION-CLUSTER
# unit is itself Before=postgresql.service. The step 12 PostgreSQL image of
# 2026-10-09 started postgresql@17-main first, which stopped with 'could not
# load server certificate file "/etc/ssl/certs/ssl-cert-snakeoil.pem"'.
#
# No Condition: a cluster that is skipped hides the fault. If
# keel-host-keys.service fails, it is in 'systemctl --failed'.
[Unit]
Wants=keel-host-keys.service
After=keel-host-keys.service
